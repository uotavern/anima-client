[package]
name = "anima-agent"
version = "0.0.0"
edition = "2021"
description = "Autonomous AI brains for anima — they consume Observation and emit Action over the anima-core contract."
license = "MIT OR Apache-2.0"

[dependencies]
anima-core = { path = "../anima-core" }
# Headless: the brains drive a Session and never need the web UI.
anima-session = { path = "../anima-session" }
# Observation JSON ↔ Action for `LlmBrain`. The brain still never parses
# packets; this is the same contract the NDJSON bridge uses.
anima-contract-json = { path = "../anima-contract-json" }
serde_json = "1"
# Only for `MapData` (WalkTo pathfinding terrain) — the brain itself never
# touches assets, just the runner in `main.rs`.
anima-assets = { path = "../anima-assets" }

[[bin]]
name = "anima-brain"
path = "src/main.rs"
