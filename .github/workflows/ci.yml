name: CI

on:
  push:
    branches: ["**"] # Release tags run these gates through release.yml.
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust, WASM, and web quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Installs the channel + components + targets `rust-toolchain.toml` pins;
      # `show` then prints what the rest of the job will actually use. Locally,
      # `scripts/check.sh` runs these same gates and refuses to start when the
      # active toolchain isn't the pinned one.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Check WASM build
        run: cargo check -p anima-wasm --target wasm32-unknown-unknown
      - name: Check web JavaScript syntax
        run: find web -name "*.js" -not -path "web/vendor/*" -print0 | xargs -0 -n1 node --check
      - name: Check desktop setup JavaScript
        run: node --check crates/anima-desktop/frontend-dist/setup.js
      # The step above compiles each file ALONE. These are classic scripts
      # sharing one global scope, so two files declaring the same top-level
      # `const` is a SyntaxError that kills the later file — and only shows up
      # when they are compiled together, the way the browser loads them.
      - name: Check web scripts share one scope
        run: node scripts/check-web-globals.mjs
      # Both steps above stop at "it parses". This one RUNS web/js: web/test
      # loads the real scripts into a fake DOM and drives the renderer
      # head-less — no network, no shard, no UO data files, seeded RNG and a
      # test-owned clock so it cannot flake here.
      - name: Run web/js tests
        run: node web/test/run.js
      - name: Test release and forum tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  desktop:
    name: Desktop compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check desktop shell
        run: cargo check -p anima-desktop
      - name: Lint desktop shell and tests
        run: cargo clippy -p anima-desktop --all-targets -- -D warnings
      - name: Test desktop configuration and setup
        run: cargo test -p anima-desktop
      - name: Test native asset readers
        run: cargo test -p anima-assets --lib
      - name: Test native connections and saved servers
        run: cargo test -p anima-session -p anima-net --lib
      - name: Test Windows Credential Manager with a disposable profile
        if: runner.os == 'Windows'
        run: cargo test -p anima-desktop native_profile_password_lifecycle -- --ignored
